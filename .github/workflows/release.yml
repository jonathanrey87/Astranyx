name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, attest, and upload
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate tag and package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          if tag[1:] != version:
              raise SystemExit(
                  f"Tag/package mismatch: tag={tag}, package={version}"
              )

          print(f"Validated {tag} against package version {version}")
          PY

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 twine==6.2.0

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          python -m venv "${RUNNER_TEMP}/astranyx-release"
          "${RUNNER_TEMP}/astranyx-release/bin/python" -m pip install dist/*.whl
          actual="$("${RUNNER_TEMP}/astranyx-release/bin/astranyx" --version)"
          expected="astranyx ${RELEASE_TAG#v}"
          test "$actual" = "$expected"
          echo "Validated CLI version: $actual"

      - name: Publish package distributions to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Retain workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astranyx-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 90


      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
