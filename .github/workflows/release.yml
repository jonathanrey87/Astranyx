              or len(sdists) != 1
              or not manifest.is_file()
          ):
              raise SystemExit("Unexpected artifact inventory")

          expected = {wheels[0].name, sdists[0].name}
          checksums = {}

          for line in manifest.read_text(
              encoding="utf-8"
          ).splitlines():
              match = re.fullmatch(
                  r"([0-9a-f]{64})  ([A-Za-z0-9_.+-]+)",
                  line,
              )

              if not match:
                  raise SystemExit("Invalid checksum entry")

              digest, name = match.groups()

              if name not in expected or name in checksums:
                  raise SystemExit("Unexpected checksum entry")

              checksums[name] = digest

          if set(checksums) != expected:
              raise SystemExit("Incomplete checksum manifest")

          for name, expected_digest in checksums.items():
              with Path(name).open("rb") as stream:
                  actual = hashlib.file_digest(
                      stream, "sha256"
                  ).hexdigest()

              if actual != expected_digest:
                  raise SystemExit(f"Checksum mismatch: {name}")

              print(f"Verified: {name}")

          print("Artifact inventory and integrity verified")
          PY_VERIFY

      - name: Verify cryptographic build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1
          done

