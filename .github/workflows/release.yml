              expected_names = {p.name for p in originals}

              if (
                  len(originals) != 2
                  or sum(p.name.endswith(".whl") for p in originals) != 1
                  or sum(p.name.endswith(".tar.gz") for p in originals) != 1
                  or {p.name for p in copies} != expected_names
              ):
                  raise SystemExit("Copied package inventory mismatch")

              for original in originals:
                  with original.open("rb") as stream:
                      expected_digest = hashlib.file_digest(
                          stream, "sha256"
                      ).hexdigest()

                  with (destination / original.name).open("rb") as stream:
                      actual_digest = hashlib.file_digest(
                          stream, "sha256"
                      ).hexdigest()

                  if actual_digest != expected_digest:
                      raise SystemExit("Copied package digest mismatch")
          else:
              if metadata is None:
                  raise SystemExit("Published PyPI version missing")

              info = metadata["info"]

              if (
                  re.sub(r"[-_.]+", "-", info["name"]).lower()
                  != "astranyx-engine"
                  or info["version"] != tag[1:]
              ):
                  raise SystemExit("PyPI package identity mismatch")

              expected = {}

              for artifact in Path("dist").iterdir():
                  if artifact.name == "SHA256SUMS":
                      continue
                  with artifact.open("rb") as stream:
                      expected[artifact.name] = hashlib.file_digest(
                          stream, "sha256"
                      ).hexdigest()

              observed = {}

              for artifact in metadata["urls"]:
                  name = artifact["filename"]

                  if name in observed or artifact["yanked"]:
                      raise SystemExit("Unexpected PyPI artifact")

                  observed[name] = artifact["digests"]["sha256"]

              if observed != expected:
                  raise SystemExit("PyPI artifact inventory mismatch")

          print(f"Verified release commit: {sha}")
          print(f"Publication guard passed: {stage}")
          PY_PREFLIGHT

      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
