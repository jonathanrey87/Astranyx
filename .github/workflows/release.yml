          import json
          from pathlib import Path
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["GITHUB_SHA"]

          if not re.fullmatch(
              r"v[0-9]+[.][0-9]+[.][0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?",
              tag,
