name: Astranyx CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check astranyx tests

      - name: Black
        run: |
          find astranyx tests -name '*.py' -type f -print0 \
            | xargs -0 -n 1 black --check --quiet

      - name: Tests
        run: |
          pytest -q

  windows-integrity:
    name: Windows integrity baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Investigation integrity baseline
        run: >
          python -m pytest -q -rx
          tests/test_investigation_integrity.py
          -k "accepts_intact_investigation or
          reports_modified_and_missing_artifacts or
          rejects_unsafe_and_duplicate_paths or
          returns_verified_manifest or windows_rejects_symlinked_manifest or windows_rejects_artifact_swapped_after_validation"
