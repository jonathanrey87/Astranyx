name: Astranyx CI

on:
  push:
    branches:
      - main
      - feature/**
      - development/**
      - fix/windows-secure-reader
  pull_request:
    branches:
      - main
      - ci/windows-python314-baseline
permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check astranyx tests

      - name: Black
        run: |
          find astranyx tests -name '*.py' -type f -print0 \
            | xargs -0 -n 1 black --check --quiet

      - name: Install locked Linux SBOM tooling
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/sbom-linux-py314.lock

      - name: Require Linux SBOM regression tests
        if: matrix.python-version == '3.14'
        run: |
          python -c "import cyclonedx, packageurl, packaging"
          python -m pytest tests/test_sbom.py -q --junitxml=sbom-results.xml
          python -c "import xml.etree.ElementTree as E; import sys; s=E.parse('sbom-results.xml').findall('.//testsuite'); sys.exit(not s or sum(int(x.get('tests', '0')) for x in s) < 24 or any(int(x.get('skipped', '0')) for x in s))"

      - name: Tests
        run: |
          pytest -q

  windows-integrity:
    name: Windows integrity baseline (${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Investigation integrity baseline
        run: >
          python -m pytest -q -rx
          tests/test_investigation_integrity.py
          -k "accepts_intact_investigation or
          reports_modified_and_missing_artifacts or
          rejects_unsafe_and_duplicate_paths or
          returns_verified_manifest or windows_rejects_symlinked_manifest or windows_rejects_artifact_swapped_after_validation or windows_rejects_intermediate_directory_swap or windows_uses_pinned_parent_after_junction_created"

  package:
    name: Build and validate release artifacts (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packaging tools
        run: python -m pip install build==1.5.0 twine==6.2.0

      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Check wheel installation in clean environment
        shell: bash
        run: |
          python -m venv /tmp/astranyx-wheel-smoke
          /tmp/astranyx-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/astranyx-wheel-smoke/bin/python -m pip show astranyx-engine
          /tmp/astranyx-wheel-smoke/bin/astranyx --help

  windows-full-suite:
    name: Windows full test suite (3.14)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install locked Windows SBOM tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/sbom-windows-py314.lock

      - name: Require Windows SBOM regression tests
        run: |
          python -c "import cyclonedx, packageurl, packaging"
          python -m pytest tests/test_sbom.py -q --junitxml=sbom-results.xml
          python -c "import xml.etree.ElementTree as E; import sys; s=E.parse('sbom-results.xml').findall('.//testsuite'); sys.exit(not s or sum(int(x.get('tests', '0')) for x in s) < 24 or any(int(x.get('skipped', '0')) for x in s))"

      - name: Run full pytest suite
        run: python -m pytest -q -ra
