name: Orion CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.1.1 black==26.5.1 ruff==0.16.1

      - name: Ruff
        run: |
          ruff check argus tests

      - name: Black
        run: |
          black --check --target-version py313 argus tests

      - name: Tests
        run: |
          pytest -q
